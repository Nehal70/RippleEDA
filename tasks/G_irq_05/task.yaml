id: G_irq_05
name: irq_multibug_05
category: rtl-repair
difficulty: hard
top: irq_ctrl
rtl: [rtl/irq_ctrl.sv]
lib: sky130hd
prompt: |
  rtl/irq_ctrl.sv isn't passing. Fix it. Keep the port list. It must close timing at 2.5 ns.
checks:
  - {type: lint, weight: 1}
  - {type: sim, tb: ["tb/tb_irq.sv"], top: tb, weight: 4, variants: [{"params": {"SEED": 7}}, {"params": {"SEED": 4242}}]}
  - {type: synth, no_latches: true, max_cells: 84, weight: 1}
  - {type: sta, period_ns: 2.5, clock: clk, weight: 1}
generated_from: irq
bugs: ["b2_ack_clears_all", "b3_priority_reversed", "b4_disabled_edge_dropped", "b5_clear_beats_new_edge", "b6_irq_ignores_enable"]
reference_cells: 76
why_mcts: |
  5 independent bugs drawn from a verified catalog. The prompt carries no spec and no testbench:
  the behavioural contract is only in the SPEC header of the RTL, so the agent must read it, write its
  own tests, and find and fix all 5 bugs without regressing; search keeps each verified fix as a node.
