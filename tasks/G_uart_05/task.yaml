id: G_uart_05
name: uart_multibug_05
category: rtl-repair
difficulty: hard
top: uart_tx
rtl: [rtl/uart_tx.sv]
lib: sky130hd
prompt: |
  rtl/uart_tx.sv isn't passing. Fix it. Keep the port list. It must close timing at 4 ns.
checks:
  - {type: lint, weight: 1}
  - {type: sim, tb: ["tb/tb_uart.sv"], top: tb, weight: 4, variants: [{"params": {"CPB": 4}}, {"params": {"CPB": 16}}, {"params": {"CPB": 300}}]}
  - {type: synth, no_latches: true, max_cells: 98, weight: 1}
  - {type: sta, period_ns: 4.0, clock: clk, weight: 1}
generated_from: uart
bugs: ["u1_counter_8bit", "u3_no_stop_bit", "u4_busy_drops_in_stop", "u5_start_bit_high"]
reference_cells: 89
why_mcts: |
  4 independent bugs drawn from a verified catalog. The prompt carries no spec and no testbench:
  the behavioural contract is only in the SPEC header of the RTL, so the agent must read it, write its
  own tests, and find and fix all 4 bugs without regressing; search keeps each verified fix as a node.
