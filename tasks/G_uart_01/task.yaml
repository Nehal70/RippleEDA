id: G_uart_01
name: uart_multibug_01
category: rtl-repair
difficulty: hard
top: uart_tx
rtl: [rtl/uart_tx.sv]
lib: sky130hd
prompt: |
  rtl/uart_tx.sv is an 8N1 UART transmitter (LSB first, idle high)
  parameterised by CLKS_PER_BIT (any value >= 2). tx_busy covers the whole
  frame and frames may be sent back-to-back. Make it signoff-ready at 4 ns.
  Keep the port list.
  tb/tb_smoke_uart.sv is the block's smoke test.
public_checks:   # run by the honest PRM (files from the original start/, agent edits ignored)
  - {type: sim, tb: [tb/tb_smoke_uart.sv], top: tb_smoke}
checks:
  - {type: lint, weight: 1}
  - {type: sim, tb: ["tb/tb_uart.sv"], top: tb, weight: 4, variants: [{"params": {"CPB": 4}}, {"params": {"CPB": 16}}, {"params": {"CPB": 300}}]}
  - {type: synth, no_latches: true, weight: 1}
  - {type: sta, period_ns: 4.0, clock: clk, weight: 1}
generated_from: uart
bugs: ["u2_msb_first", "u3_no_stop_bit", "u4_busy_drops_in_stop", "u6_seven_data_bits"]
why_mcts: |
  4 independent bugs drawn from a verified catalog; each is caught on its own by the public
  smoke test, so every verified fix raises the public reward. A single trajectory must find and fix
  all 4 without regressing; search keeps each fix as a node.
